[project]
name = "courtlab"
version = "0.1.0"
description = "Evidence-based Warriors and Heat tactics research for amateur five-on-five teams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "openai-agents[litellm]>=0.22",
  "google-cloud-aiplatform>=1.40.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
]
[dependency-groups]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
